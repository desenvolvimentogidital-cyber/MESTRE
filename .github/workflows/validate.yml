name: Validar Mestre

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint e compilacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar codigo
        run: npm run lint
      - name: Compilar aplicacao
        run: npm run build
      - name: Testar paginas publicas e protecao sem variaveis externas
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 >/tmp/mestre-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -sSf --max-time 2 http://127.0.0.1:3000/ -o /dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /acesso /inicio; do
            status=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$route")
            echo "$route status: $status"
            test "$status" = "200"
          done
          protected=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/cliente")
          echo "/cliente status: $protected"
          test "$protected" = "307"

