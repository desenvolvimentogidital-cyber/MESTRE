name: Validar Mestre

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint e compilacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar codigo
        run: npm run lint
      - name: Testar senhas vazadas sem conexão externa
        run: node --no-warnings --experimental-strip-types scripts/test-password-breach.mjs
      - name: Compilar aplicacao
        run: npm run build
      - name: Testar paginas publicas e protecao sem variaveis externas
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 >/tmp/mestre-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -sSf --max-time 2 http://127.0.0.1:3000/ -o /dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /acesso /inicio /instalar /profissionais /oportunidades /privacidade /termos /suporte /oportunidades/00000000-0000-0000-0000-000000000000; do
            status=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$route")
            echo "$route status: $status"
            test "$status" = "200"
          done
          # Chosen concept 1: mobile home visible from both / and /inicio.
          curl -fsS http://127.0.0.1:3000/ -o /tmp/mandafazer-one-home.html
          curl -fsS http://127.0.0.1:3000/inicio -o /tmp/mandafazer-one-explore.html
          python3 - <<'PY'
          from pathlib import Path
          root=Path("/tmp/mandafazer-one-home.html").read_text()
          explore_html=Path("/tmp/mandafazer-one-explore.html").read_text()
          home=Path("app/inicio/page.tsx").read_text()
          css=Path("app/mandafazer-image-one.css").read_text()
          header=Path("components/conectaserv-ui.tsx").read_text()
          layout=Path("app/layout.tsx").read_text()
          assert 'import "./mandafazer-image-one.css"' in layout
          assert 'import ExplorePage from "./inicio/page"' in Path("app/page.tsx").read_text()
          for classname in [
              "mf-v1-hero","mf-v1-search-panel","mf-v1-location-line",
              "mf-v1-benefits","mf-v1-category-scroll","mf-v1-nearby",
              "mf-v1-pro-grid","mf-v1-primary-cta"
          ]:
              assert classname in root, ("homepage missing",classname)
              assert classname in explore_html, ("explore missing",classname)
              assert "."+classname in css, ("CSS missing",classname)
          assert "mf-v1-header-menu" in header and "mf-v1-header" in header
          assert "<MessageUnreadBadge" in header
          assert "<NotificationBell" not in header
          assert 'html[data-theme="dark"]' in css
          assert "mf-theme-boot" in layout
          for marker in ['"/profissionais?',"categoria=","mandafazer-city","search_professional_profiles"]:
              assert marker in home, marker
          for screen,selector in [
              ("app/cliente/page.tsx","mf-workspace-hero"),
              ("app/prestador/page.tsx","mf-workspace-hero"),
              ("app/propostas/page.tsx","mf-proposal-metrics"),
              ("app/conversas/page.tsx","mf-inbox-intro"),
              ("app/perfil/page.tsx","mf-profile-intro")
          ]:
              assert selector in Path(screen).read_text(), (screen,selector)
          assert Path("app/cliente/layout.tsx").exists()
          assert Path("app/prestador/layout.tsx").exists()
          print("Chosen concept 1, dark mode and independent dashboards OK")
          PY
          # The uploaded MandaFazer logo must be served as a real image and
          # replace the former inline brand mark, in both account interfaces.
          curl -fsS --max-time 10 "http://127.0.0.1:3000/mandafazer-logo.avif?v=20261122" -o /tmp/mandafazer-logo.avif
          python3 - <<'PY'
          from pathlib import Path
          icon=Path("/tmp/mandafazer-logo.avif").read_bytes()
          assert len(icon)>4000 and b"ftypavif" in icon[:32], "MandaFazer AVIF missing"
          ui=Path("components/conectaserv-ui.tsx").read_text()
          css=Path("app/conectaserv.css").read_text()
          assert "mandafazer-logo.avif?v=20261122" in ui
          assert "cs-brand-banner" in ui
          assert "cs-brand" in ui and "<svg className=\"cs-mark\"" not in ui
          assert 'html[data-theme="dark"] .cs-app-head' in css
          assert 'html[data-theme="dark"] .cs-splash-header' in css
          assert "background:#04142b;" in css
          print("MandaFazer header image and stable theme passed")
          PY
          curl -fsS --max-time 10 http://127.0.0.1:3000/ > /tmp/mandafazer-home.html
          grep -q 'mandafazer-logo.avif' /tmp/mandafazer-home.html
          # Message notifications are now restricted to each service conversation.
          # The top header bell should no longer be present in public HTML.
          python3 - <<'PY'
          from pathlib import Path
          ui=Path("components/conectaserv-ui.tsx").read_text()
          assert "<NotificationBell" not in ui
          assert "<MessageUnreadBadge" in ui
          for role in ["client","provider"]:
              assert f'role==="{role}"' in ui
          assert Path("app/cliente/layout.tsx").exists()
          assert Path("app/prestador/layout.tsx").exists()
          print("Account navigation and chat badge checks OK")
          PY
          # The registration endpoint must reject invalid data immediately
          # without attempting to create a user or contact the auth provider.
          signup_status=$(curl --max-time 8 -s -o /tmp/registration-check.json -w "%{http_code}" \
            -X POST "http://127.0.0.1:3000/api/auth/registrar" \
            -H "Content-Type: application/json" \
            --data '{"name":"X","email":"not-an-email","password":"x","type":"client"}')
          echo "Invalid registration status: $signup_status"
          test "$signup_status" = "400"
          # Terms acceptance is required before Auth is called.
          missing_terms=$(curl --max-time 8 -s -o /tmp/missing-terms.json -w "%{http_code}" \
            -X POST "http://127.0.0.1:3000/api/auth/registrar" \
            -H "Content-Type: application/json" \
            --data '{"name":"Pessoa Teste","email":"alguem@example.invalid","password":"SenhaForte1234","type":"client"}')
          test "$missing_terms" = "400"
          grep -q 'Termos de Uso' /tmp/missing-terms.json
          python3 - <<'PY'
          from pathlib import Path
          signup=Path("app/api/auth/registrar/route.ts").read_text()
          access=Path("app/acesso/page.tsx").read_text()
          privacy=Path("app/privacidade/page.tsx").read_text()
          terms=Path("app/termos/page.tsx").read_text()
          support=Path("components/support-form.tsx").read_text()
          inbox=Path("components/admin-workspace.tsx").read_text()
          migration=Path("supabase/migrations/20261123102900_public_support_private_admin_inbox.sql").read_text()
          ui=Path("components/conectaserv-ui.tsx").read_text()
          assert "body.acceptedTerms!==true" in signup
          assert "password.length<10" in signup
          assert "acceptedTerms:termsAccepted" in access
          assert 'href="/privacidade"' in access and 'href="/termos"' in access
          assert "Política de Privacidade" in privacy and "direitos" in privacy
          assert "Termos de Uso" in terms
          assert 'submit_support_ticket' in support and "MF-" in support
          assert "support_tickets" in inbox and "admin_handle_support_ticket" in inbox
          assert "private.is_moderator()" in migration
          assert "support_tickets_admin_read" in migration
          assert "24 hours" in migration and "count(*)" in migration
          assert 'href="/suporte"' in ui
          print("Legal pages, signup acceptance, password strength, support inbox protection OK")
          breach=Path("lib/security/password-breach.ts").read_text()
          reset_api=Path("app/api/conta/redefinir-senha/route.ts").read_text()
          reset_page=Path("app/redefinir-senha/page.tsx").read_text()
          legal_admin=Path("components/admin-legal-settings.tsx").read_text()
          assert 'hasKnownLeakedPassword(password)' in signup
          assert 'hasKnownLeakedPassword(password)' in reset_api
          assert 'createHash("sha1")' in breach and '"Add-Padding":"true"' in breach
          assert 'db.auth.getUser()' in reset_api and 'db.auth.updateUser({password})' in reset_api
          assert 'fetch("/api/conta/redefinir-senha"' in reset_page
          assert 'db.auth.updateUser({ password })' not in reset_page
          assert 'fillFromMyAccount' in legal_admin and 'if(!confirmed)' in legal_admin
          assert 'setConfirmed(false)' in legal_admin and 'mf-admin-legal-confirm' in legal_admin
          assert 'window.location.hash==="#configuracoes"' in inbox
          print("Password breach checks and owner-confirmed legal identity OK")

          operator=Path("components/public-operator.tsx").read_text()
          settings=Path("components/admin-legal-settings.tsx").read_text()
          settings_migration=Path("supabase/migrations/20261123103536_admin_legal_identity_public_settings.sql").read_text()
          assert "site_legal_settings" in operator
          assert "admin_update_site_legal_settings" in settings
          assert "private.is_moderator()" in settings_migration
          assert "revoke all on public.site_legal_settings" in settings_migration
          assert "<PublicOperator/>" in privacy and "<PublicOperator/>" in terms
          assert "operator_name" in settings and "contact_email" in settings
          assert 'view==="settings"&&<AdminLegalSettings/>' in inbox
          assert 'redirect(areas?.length?"/prestador":"/prestador/perfil")' in Path("app/painel/page.tsx").read_text()
          print("Public operator identity and onboarding controlled by real administrator")

          PY

          # Ensure PWA icon comes from the user-supplied Mestre logo, not CS text.
          grep -q 'mestreIconJpeg' 'app/icons/[size]/route.ts'
          test -s 'lib/assets/mestre-original-icon.ts'
          # Chrome Android needs a valid install manifest and PNG icons at both sizes.
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest -o /tmp/conectaserv-manifest.json
          python3 - <<'PY'
          import json
          with open("/tmp/conectaserv-manifest.json",encoding="utf-8") as f:
              data=json.load(f)
          assert data["display"] == "standalone"
          assert data["start_url"] == "/"
          assert {x["sizes"] for x in data["icons"]} >= {"192x192","512x512"}
          print("Manifest PWA OK")
          PY
          for size in 192 512; do
            curl -fsS "http://127.0.0.1:3000/icons/$size" -o "/tmp/conectaserv-$size.png"
            python3 - "$size" <<'PY'
          import struct,sys
          size=int(sys.argv[1])
          with open(f"/tmp/conectaserv-{size}.png","rb") as f:
              blob=f.read(24)
          assert blob[:8]==b"\x89PNG\r\n\x1a\n", "Icon is not a PNG"
          assert struct.unpack(">II",blob[16:24])==(size,size), "Unexpected icon dimensions"
          print(f"PNG {size}x{size} OK")
          PY
          done
          guest_contact=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/profissional/00000000-0000-0000-0000-000000000001?iniciar=1")
          echo "Contact without login: $guest_contact"
          test "$guest_contact" = "307"
          # Admin interface is invisible: guests, customers, and professionals
          # must not receive the administration or the former demo/activation.
          for hidden_route in /admin /admin/teste /admin/ativar; do
            hidden_code=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$hidden_route")
            echo "$hidden_route (guest): $hidden_code"
            test "$hidden_code" = "404"
          done
          # The ordinary login remains available so the sole authorized owner
          # can authenticate and then open the protected /admin URL.
          login_code=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/acesso)
          test "$login_code" = "200"
          python3 - <<'PY'
          from pathlib import Path
          portal=Path("app/admin/page.tsx").read_text()
          layout=Path("app/admin/layout.tsx").read_text()
          header=Path("components/conectaserv-ui.tsx").read_text()
          profile=Path("app/perfil/page.tsx").read_text()
          panel=Path("app/painel/page.tsx").read_text()
          middleware=Path("middleware.ts").read_text()
          registration=Path("app/api/auth/registrar/route.ts").read_text()
          migration=Path("supabase/migrations/20261123124451_close_owner_admin_registration_after_activation.sql").read_text()
          assert "notFound()" in portal
          assert 'db.from("admin_members")' in portal
          assert 'profile?.account_type!=="admin"' in portal
          assert 'getUser()' in portal
          assert "AdminWorkspace" in portal
          assert "AdminAccess" not in portal
          assert "<AppFrame" not in portal and "<AppFrame" not in layout
          assert "robots:" in layout and "index:false" in layout
          assert 'href="/admin"' not in header and 'href="/admin"' not in profile
          assert 'request.nextUrl.pathname==="/admin"' in middleware
          assert "Cache-Control" in middleware and "X-Robots-Tag" in middleware
          assert not Path("app/admin/teste/page.tsx").exists()
          assert not Path("app/admin/ativar/page.tsx").exists()
          assert not Path("app/admin/admin-access.tsx").exists()
          assert "revoke execute" in migration and "activate_admin_with_invite" in migration
          assert 'profile?.account_type === "admin"' in panel
          assert 'new Set(["client","provider"])' in registration
          client_layout=Path("app/cliente/layout.tsx").read_text()
          provider_layout=Path("app/prestador/layout.tsx").read_text()
          assert 'getUser()' in client_layout and 'getUser()' in provider_layout
          assert 'select("account_type")' in client_layout
          assert 'select("account_type")' in provider_layout
          assert 'profile?.account_type!=="client"' in client_layout
          assert 'profile?.account_type!=="provider"' in provider_layout
          print("Admin: hidden to visitors, demo retired, single owner membership required")
          PY
          python3 - <<'PY'
          from pathlib import Path
          cancel_ui=Path("components/cancel-request-button.tsx").read_text()
          client_home=Path("app/cliente/page.tsx").read_text()
          cancel_migration=Path("supabase/migrations/20261122222015_cancel_uncontracted_service_request.sql").read_text()
          assert 'cancel_my_service_request' in cancel_ui
          assert 'request.status === "published"' in client_home
          assert '<CancelRequestButton requestId={request.id}/>' in client_home
          assert "private.has_account_role('client')" in cancel_migration
          assert "for update" in cancel_migration and "status='cancelled'" in cancel_migration
          assert "status='rejected'" in cancel_migration
          assert "grant execute" in cancel_migration and "revoke execute" in cancel_migration
          print("Owner-only cancellation and rejection of pending proposals OK")

          # Every category must show only related professionals, not service-type cards.
          discovery=Path("components/public-marketplace-search.tsx").read_text()
          home=Path("app/inicio/page.tsx").read_text()
          provider_home=Path("app/prestador/page.tsx").read_text()
          provider_form=Path("components/provider-profile-form.tsx").read_text()
          assert 'href={"/profissionais?categoria="+encodeURIComponent(cat.id)}' in home
          assert 'p_category_id:filter.category||null' in discovery
          assert 'p_query:categoryView?"":filter.query' in discovery
          assert 'p_city:categoryView?"":filter.city' in discovery
          assert '"Profissionais de "+category.name' in discovery
          assert 'serviceSuggestions' not in discovery
          assert 'selectedService' not in discovery
          assert 'Serviços relacionados' not in discovery
          assert "selectedAreas.size===0" in provider_home
          assert 'if(selected.length===0)' in provider_form
          assert not Path("lib/service-catalog.ts").exists()
          print("Category clicks show only associated professional profiles, no service list")
          profile_page=Path("app/prestador/perfil/page.tsx").read_text()
          profile_public=Path("app/profissional/[id]/page.tsx").read_text()
          service_form=Path("components/provider-profile-form.tsx").read_text()
          service_choices=Path("lib/provider-service-options.ts").read_text()
          service_migration=Path("supabase/migrations/20261124172205_provider_multi_service_activities.sql").read_text()
          assert 'services' in profile_page and 'services' in profile_public
          assert 'providerServiceGroups' in service_form
          assert 'Assentamento de azulejos' in service_choices
          assert 'Alvenaria' in service_choices and 'Encanamento' in service_choices
          assert 'services,' in service_form
          assert 'provider_categories' in service_form and 'selected.length===0' in service_form
          assert 'grant update (services)' in service_migration
          assert 'p_category_id is null' in service_migration and 'pp.services' in service_migration
          print("A single professional can list many specific trades and appear in several chosen categories")



          PY
          for protected_route in /cliente /prestador /prestador/perfil /propostas /perfil /notificacoes /conversas /denuncias /denuncias/nova /avaliar/00000000-0000-0000-0000-000000000000; do
            protected=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$protected_route")
            echo "$protected_route status: $protected"
            test "$protected" = "307"
          done

