name: Validar Mestre

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint e compilacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar codigo
        run: npm run lint
      - name: Compilar aplicacao
        run: npm run build
      - name: Testar paginas publicas e protecao sem variaveis externas
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 >/tmp/mestre-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -sSf --max-time 2 http://127.0.0.1:3000/ -o /dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /acesso /inicio /instalar /profissionais /oportunidades /oportunidades/00000000-0000-0000-0000-000000000000; do
            status=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$route")
            echo "$route status: $status"
            test "$status" = "200"
          done
          # Chosen concept 1: mobile home visible from both / and /inicio.
          curl -fsS http://127.0.0.1:3000/ -o /tmp/mandafazer-one-home.html
          curl -fsS http://127.0.0.1:3000/inicio -o /tmp/mandafazer-one-explore.html
          python3 - <<'PY'
          from pathlib import Path
          root=Path("/tmp/mandafazer-one-home.html").read_text()
          explore_html=Path("/tmp/mandafazer-one-explore.html").read_text()
          home=Path("app/inicio/page.tsx").read_text()
          css=Path("app/mandafazer-image-one.css").read_text()
          header=Path("components/conectaserv-ui.tsx").read_text()
          layout=Path("app/layout.tsx").read_text()
          assert 'import "./mandafazer-image-one.css"' in layout
          assert 'import ExplorePage from "./inicio/page"' in Path("app/page.tsx").read_text()
          for classname in [
              "mf-v1-hero","mf-v1-search-panel","mf-v1-location-line",
              "mf-v1-benefits","mf-v1-category-scroll","mf-v1-nearby",
              "mf-v1-pro-grid","mf-v1-primary-cta"
          ]:
              assert classname in root, ("homepage missing",classname)
              assert classname in explore_html, ("explore missing",classname)
              assert "."+classname in css, ("CSS missing",classname)
          assert "mf-v1-header-menu" in header and "mf-v1-header" in header
          assert "<MessageUnreadBadge" in header
          assert "<NotificationBell" not in header
          assert 'html[data-theme="dark"]' in css
          assert "mf-theme-boot" in layout
          for marker in ['"/profissionais?',"categoria=","mandafazer-city","search_professional_profiles"]:
              assert marker in home, marker
          for screen,selector in [
              ("app/cliente/page.tsx","mf-workspace-hero"),
              ("app/prestador/page.tsx","mf-workspace-hero"),
              ("app/propostas/page.tsx","mf-proposal-metrics"),
              ("app/conversas/page.tsx","mf-inbox-intro"),
              ("app/perfil/page.tsx","mf-profile-intro")
          ]:
              assert selector in Path(screen).read_text(), (screen,selector)
          assert Path("app/cliente/layout.tsx").exists()
          assert Path("app/prestador/layout.tsx").exists()
          print("Chosen concept 1, dark mode and independent dashboards OK")
          PY
          # The uploaded MandaFazer logo must be served as a real image and
          # replace the former inline brand mark, in both account interfaces.
          curl -fsS --max-time 10 "http://127.0.0.1:3000/mandafazer-logo.avif?v=20261122" -o /tmp/mandafazer-logo.avif
          python3 - <<'PY'
          from pathlib import Path
          icon=Path("/tmp/mandafazer-logo.avif").read_bytes()
          assert len(icon)>4000 and b"ftypavif" in icon[:32], "MandaFazer AVIF missing"
          ui=Path("components/conectaserv-ui.tsx").read_text()
          css=Path("app/conectaserv.css").read_text()
          assert "mandafazer-logo.avif?v=20261122" in ui
          assert "cs-brand-banner" in ui
          assert "cs-brand" in ui and "<svg className=\"cs-mark\"" not in ui
          assert 'html[data-theme="dark"] .cs-app-head' in css
          assert 'html[data-theme="dark"] .cs-splash-header' in css
          assert "background:#04142b;" in css
          print("MandaFazer header image and stable theme passed")
          PY
          curl -fsS --max-time 10 http://127.0.0.1:3000/ > /tmp/mandafazer-home.html
          grep -q 'mandafazer-logo.avif' /tmp/mandafazer-home.html
          # Message notifications are now restricted to each service conversation.
          # The top header bell should no longer be present in public HTML.
          python3 - <<'PY'
          from pathlib import Path
          ui=Path("components/conectaserv-ui.tsx").read_text()
          assert "<NotificationBell" not in ui
          assert "<MessageUnreadBadge" in ui
          for role in ["client","provider"]:
              assert f'role==="{role}"' in ui
          assert Path("app/cliente/layout.tsx").exists()
          assert Path("app/prestador/layout.tsx").exists()
          print("Account navigation and chat badge checks OK")
          PY
          # The registration endpoint must reject invalid data immediately
          # without attempting to create a user or contact the auth provider.
          signup_status=$(curl --max-time 8 -s -o /tmp/registration-check.json -w "%{http_code}" \
            -X POST "http://127.0.0.1:3000/api/auth/registrar" \
            -H "Content-Type: application/json" \
            --data '{"name":"X","email":"not-an-email","password":"x","type":"client"}')
          echo "Invalid registration status: $signup_status"
          test "$signup_status" = "400"
          # Ensure PWA icon comes from the user-supplied Mestre logo, not CS text.
          grep -q 'mestreIconJpeg' 'app/icons/[size]/route.ts'
          test -s 'lib/assets/mestre-original-icon.ts'
          # Chrome Android needs a valid install manifest and PNG icons at both sizes.
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest -o /tmp/conectaserv-manifest.json
          python3 - <<'PY'
          import json
          with open("/tmp/conectaserv-manifest.json",encoding="utf-8") as f:
              data=json.load(f)
          assert data["display"] == "standalone"
          assert data["start_url"] == "/"
          assert {x["sizes"] for x in data["icons"]} >= {"192x192","512x512"}
          print("Manifest PWA OK")
          PY
          for size in 192 512; do
            curl -fsS "http://127.0.0.1:3000/icons/$size" -o "/tmp/conectaserv-$size.png"
            python3 - "$size" <<'PY'
          import struct,sys
          size=int(sys.argv[1])
          with open(f"/tmp/conectaserv-{size}.png","rb") as f:
              blob=f.read(24)
          assert blob[:8]==b"\x89PNG\r\n\x1a\n", "Icon is not a PNG"
          assert struct.unpack(">II",blob[16:24])==(size,size), "Unexpected icon dimensions"
          print(f"PNG {size}x{size} OK")
          PY
          done
          guest_contact=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/profissional/00000000-0000-0000-0000-000000000001?iniciar=1")
          echo "Contact without login: $guest_contact"
          test "$guest_contact" = "307"
          # The admin login is a separate, unlisted entry point. Guest sees
          # only the login gate; no administrative workspace or app navigation.
          admin_code=$(curl --max-redirs 0 -s -o /tmp/mf-admin-public.html -w "%{http_code}" http://127.0.0.1:3000/admin)
          echo "/admin (guest) status: $admin_code"
          test "$admin_code" = "200"
          grep -q 'mf-admin-login-card' /tmp/mf-admin-public.html
          if grep -q 'mf-admin-intro' /tmp/mf-admin-public.html; then
            echo "ERROR: admin workspace was rendered to a guest"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          profile=Path("app/perfil/page.tsx").read_text()
          portal=Path("app/admin/page.tsx").read_text()
          layout=Path("app/admin/layout.tsx").read_text()
          signin=Path("app/admin/admin-access.tsx").read_text()
          middleware=Path("middleware.ts").read_text()
          assert 'href="/admin"' not in profile
          assert "admin_members" not in profile
          assert "admin_members" in portal
          assert "if(!member||membershipError)" in portal
          assert "<AppFrame" not in portal and "<AppFrame" not in layout
          assert "robots:" in layout and "index:false" in layout
          assert 'request.nextUrl.pathname==="/admin"' in middleware
          assert "Cache-Control" in middleware and "X-Robots-Tag" in middleware
          assert "signInWithPassword" in signin and "signUp" not in signin
          print("Admin portal isolation, owner gate and noindex checks OK")
          PY
          for protected_route in /cliente /prestador /prestador/perfil /propostas /perfil /notificacoes /conversas /denuncias /denuncias/nova /avaliar/00000000-0000-0000-0000-000000000000; do
            protected=$(curl --max-redirs 0 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$protected_route")
            echo "$protected_route status: $protected"
            test "$protected" = "307"
          done

